apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: my-api
labels:
  app: my-api
  deployment-mode: sandbox
parameters:
  - name: PROJECT
    description: Project to deploy into.
    displayName: Project
    required: true
  - name: APP_NAME
    description: Name of the application.
    displayName: Application Name
    value: my-api
    required: true

objects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${APP_NAME}
      namespace: ${PROJECT}
      labels:
        reference: 'true'
    data:
      TENANT_REALM: my-tenant
      ACCESS_SERVICE_URL: https://access.adsp-dev.gov.ab.ca
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${APP_NAME}
      namespace: ${PROJECT}

    spec:
      replicas: 1
      selector:
        matchLabels:
          name: ${APP_NAME}
      revisionHistoryLimit: 3
      progressDeadlineSeconds: 600
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 25%
          maxUnavailable: 25%
      template:
        metadata:
          labels:
            name: ${APP_NAME}
        spec:
          initContainers:
            - name: ${APP_NAME}-migrate

              image: image-registry.openshift-image-registry.svc:5000/${PROJECT}/my-api:sandbox

              command: ['node', 'migrate.js']
              envFrom:
                - configMapRef:
                    name: ${APP_NAME}
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: sandbox-postgres-app
                      key: username
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: sandbox-postgres-app
                      key: password
                - name: DATABASE_URL
                  value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@sandbox-postgres-rw:5432/my-api_sandbox

          containers:
            - name: ${APP_NAME}

              image: image-registry.openshift-image-registry.svc:5000/${PROJECT}/my-api:sandbox

              envFrom:
                - configMapRef:
                    name: ${APP_NAME}
              env:
                - name: PORT
                  value: '3333'
                - name: LOG_LEVEL
                  value: info
                # ADSP confidential-client secret the service uses to authenticate
                # with the access service. Sandbox: created by `nx run <app>:sandbox`
                # from the service's .env.

                - name: CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ${APP_NAME}-secrets
                      key: CLIENT_SECRET

                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: sandbox-postgres-app
                      key: username
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: sandbox-postgres-app
                      key: password
                - name: DATABASE_URL
                  value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@sandbox-postgres-rw:5432/my-api_sandbox

              imagePullPolicy: Always
              ports:
                - containerPort: 3333
                  name: http
                  protocol: TCP
              resources:
                limits:
                  cpu: 200m
                  memory: 200Mi
                requests:
                  cpu: 20m
                  memory: 50Mi
              readinessProbe:
                httpGet:
                  path: /health/ready

                  port: 3333
                initialDelaySeconds: 10
                periodSeconds: 10
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /health
                  port: 3333
                initialDelaySeconds: 30
                periodSeconds: 30
                failureThreshold: 3
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${APP_NAME}
      namespace: ${PROJECT}
    spec:
      ports:
        - name: http
          port: 3333
          protocol: TCP
          targetPort: 3333
      selector:
        name: ${APP_NAME}
      sessionAffinity: None
      type: ClusterIP
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: ${APP_NAME}
      namespace: ${PROJECT}
      annotations:
        # Baseline per-SOURCE-IP rate limiting at the router — layered under
        # whatever cross-cutting network-level rate limiting already exists
        # in front of this cluster, not a replacement for it. Exists so this
        # manifest doesn't read as "no rate limiting at all" just because the
        # real protection lives outside what's visible here.
        #
        # concurrent-tcp: max simultaneous connections from one source IP.
        # rate-tcp: max new TCP connections from one source IP per 3s (the
        #   router's own fixed window for this counter, not configurable).
        # rate-http: max HTTP requests from one source IP per 10s (likewise
        #   fixed by the router).
        #
        # Numbers below are a generous starting point — guard against
        # blatant abuse, not shape legitimate traffic — tune per app if its
        # real usage differs. A shared corporate NAT/VPN egress can put many
        # real users behind one source IP, so avoid setting these too tight.
        haproxy.router.openshift.io/rate-limit-connections: 'true'
        haproxy.router.openshift.io/rate-limit-connections.concurrent-tcp: '200'
        haproxy.router.openshift.io/rate-limit-connections.rate-tcp: '200'
        haproxy.router.openshift.io/rate-limit-connections.rate-http: '2000'
    spec:
      port:
        targetPort: http
      tls:
        termination: edge
      to:
        kind: Service
        name: ${APP_NAME}
        weight: 100
      wildcardPolicy: None
